# One-time launch: Tue 10 Nov 2026, 08:00 Israel time (06:00 UTC).
# Moves the site from the hidden preview folder to the main address and
# turns the old preview links into redirects. Does nothing if the site is
# already public. "Run workflow" by hand with dry_run = true to test it.
name: Launch site

on:
  schedule:
    - cron: '20 5 10 11 *'      # starts early: GitHub's scheduler can run late, so the job waits for 06:00 UTC itself
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test only: build everything but do not publish'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only once, in 2026, while the site is hidden
        id: check
        run: |
          if [ "$(date -u +%Y)" != "2026" ] || [ ! -f preview-uz9hsq/assets/site.js ]; then
            echo "Nothing to do: already launched (or not 2026)."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until 08:00 Israel time (06:00 UTC)
        if: steps.check.outputs.go == 'yes' && github.event_name == 'schedule'
        run: |
          target=$(date -u -d '2026-11-10 06:00:00' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then echo "Waiting $((target-now)) s"; sleep $((target-now)); fi

      - name: Launch
        if: steps.check.outputs.go == 'yes'
        run: |
          git config user.name "lior88844"
          git config user.email "lior88844@users.noreply.github.com"
          git pull --rebase -q
          python3 build_pages.py --launch
          # old preview links (already shared) -> same page at the main address
          python3 - <<'EOF'
          import os
          pages = [f for f in os.listdir('.') if f.endswith('.html') and f not in ('404.html',) and not f.startswith('google')]
          for lang in ('', 'en/'):
              os.makedirs('preview-uz9hsq/' + lang, exist_ok=True)
              for f in pages:
                  if lang and not os.path.exists(lang + f):
                      continue
                  url = '/' + lang + ('' if f == 'index.html' else f)
                  open(f'preview-uz9hsq/{lang}{f}', 'w').write(
                      '<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="robots" content="noindex">\n'
                      '<title>פסטיבל הג׳אז רעננה</title><link rel="canonical" href="https://raananajazzfestival.com' + url + '">\n'
                      '<meta http-equiv="refresh" content="0; url=' + url + '">\n'
                      "<script>location.replace('" + url + "' + location.search + location.hash)</script></head>\n"
                      '<body><a href="' + url + '">raananajazzfestival.com</a></body></html>\n')
          print('redirect pages written for', len(pages), 'pages')
          EOF
          git rm -q -r --ignore-unmatch soon
          git add -A
          git commit -q -m "Launch: site public at raananajazzfestival.com (automatic, 08:00 Israel time); old preview links redirect to the main address"
          git show --stat HEAD | tail -5
          test -f index.html && test -f assets/site.js && test -f en/index.html && ! test -f preview-uz9hsq/assets/site.js
          grep -q 'Save the Date' index.html && { echo "Still the Save the Date page!"; exit 1; } || true

      - name: Publish
        if: steps.check.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push
          sleep 20
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
